apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        # 8.8.8.8 fallback: jab Docker Desktop ka DNS timeout de,
        # Google DNS se answer aa jayega (ENOTFOUND fix)
        forward . /etc/resolv.conf 8.8.8.8 {
           max_concurrent 1000
        }
        cache 60 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
