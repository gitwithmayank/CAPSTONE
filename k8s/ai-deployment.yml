apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-deployment
  labels:
    name: ai-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-server
  template:
    metadata:
      labels:
        app: ai-server
    spec:
      containers:
        - name: ai-server
          # Tag immutable rakho aur har fix par badhao — ":latest" + Always ke
          # saath rollbacks mushkil ho jate hain. Live deployment isi tag se
          # chalni chahiye (kubectl set image), warna repo aur cluster drift
          # kar jate hain.
          image: 777171524883.dkr.ecr.ap-south-1.amazonaws.com/capstone-ai-orchestration:v3

          resources:
            requests:
              cpu: "250m"
              memory: "250M"
            limits:
              cpu: "500m"
              memory: "500M"
          env:
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secret
                  key: MISTRAL_API_KEY
            # Mistral SDK har request par hard-coded 30 s ka AbortSignal.timeout
            # lagata hai. Bade builds (poora page ek hi step me) 30 s cross karte
            # hi "The operation was aborted due to timeout" par mar jate the —
            # isliye code us deadline ko is value se replace karta hai
            # (src/agents/code.agent.js -> extendRequestTimeout).
            - name: AI_REQUEST_TIMEOUT_MS
              value: "600000"
            # Model call fail hone par retries (LangChain default 6).
            - name: AI_MODEL_RETRIES
              value: "2"

          livenessProbe:
            httpGet:
              path: /api/status/healthz
              port: 3000
            initialDelaySeconds: 90
            timeoutSeconds: 10

          readinessProbe:
            httpGet:
              path: /api/status/readyz
              port: 3000
            initialDelaySeconds: 30
            timeoutSeconds: 10
          ports:
          - containerPort: 3000
            name: ai-server-port
