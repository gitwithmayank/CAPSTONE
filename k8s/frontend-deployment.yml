apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-container
          image: 777171524883.dkr.ecr.ap-south-1.amazonaws.com/capstone-frontend
          # "latest" ek mutable tag hai — IfNotPresent ke saath naya build pull
          # nahi hota, isliye Always rakha hai.
          imagePullPolicy: Always

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"

          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 30
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            timeoutSeconds: 5

          ports:
          - containerPort: 80
            name: frontend-http
