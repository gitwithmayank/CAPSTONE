apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codespace-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "6000"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "6000"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "6000"

    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "codespace-ingress"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"

  labels:
    app.kubernetes.io/name: codespace-ingress
spec:
  ingressClassName: nginx
  # Live-preview wildcard ke liye TLS. Certificate k8s/cert-wildcard.yml se
  # banta hai (DNS-01 challenge, DuckDNS webhook solver ke through). Iske bina
  # iframe HTTPS page se http:// preview load karne par browser mixed-content
  # block kar deta hai.
  tls:
  - hosts:
    - "*.preview.aisandbox.duckdns.org"
    secretName: preview-wildcard-tls
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: "/api/sandbox"
        backend:
          service:
            name: sandbox-service
            port: 
              number: 80


  - http:
      paths:
      - pathType: Prefix
        path: "/api/ai"
        backend:
          service:
            name: ai-service
            port: 
              number: 80

  - http:
      paths:
      - pathType: Prefix
        path: "/api/auth"
        backend:
          service:
            name: auth-service
            port: 
              number: 80


  - host: "*.preview.aisandbox.duckdns.org"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: router-service
            port:
              number: 80


  - host: "*.agent.aisandbox.duckdns.org"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: router-service
            port:
              number: 80

             
