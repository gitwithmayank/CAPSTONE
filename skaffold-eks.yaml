apiVersion: skaffold/v4beta13
kind: Config

build:
  tagPolicy:
    sha256: {}

  platforms:
    - linux/amd64 
    
  artifacts:
  
  - image: 777171524883.dkr.ecr.ap-south-1.amazonaws.com/capstone-ai-orchestration
    context: ai-orchestration
    docker:
      dockerfile: Dockerfile
    

  - image: 777171524883.dkr.ecr.ap-south-1.amazonaws.com/capstone-auth
    context: auth
    docker:
      dockerfile: Dockerfile
    
        
  - image: 777171524883.dkr.ecr.ap-south-1.amazonaws.com/capstone-notification
    context: notification
    docker:
      dockerfile: Dockerfile
      

  - image: 777171524883.dkr.ecr.ap-south-1.amazonaws.com/capstone-frontend
    context: FRONTEND
    docker:
      dockerfile: Dockerfile

  - image: 777171524883.dkr.ecr.ap-south-1.amazonaws.com/capstone-agent
    context: sandbox/agent
    docker:
      dockerfile: Dockerfile

  - image: 777171524883.dkr.ecr.ap-south-1.amazonaws.com/capstone-sync-agent
    context: sandbox/sync-agent
    docker:
      dockerfile: Dockerfile

  - image: 777171524883.dkr.ecr.ap-south-1.amazonaws.com/capstone-router
    context: sandbox/router
    docker:
      dockerfile: Dockerfile

  - image: 777171524883.dkr.ecr.ap-south-1.amazonaws.com/capstone-sandbox
    context: sandbox/server
    docker:
      dockerfile: Dockerfile

  - image: 777171524883.dkr.ecr.ap-south-1.amazonaws.com/capstone-template
    context: sandbox/template
    docker:
      dockerfile: Dockerfile

manifests:
  rawYaml:
    - k8s/ai-deployment.yml
    - k8s/ai-service.yml
    - k8s/auth-deployment.yml
    - k8s/auth-service.yml
    - k8s/sandbox-deployment.yml
    - k8s/sandbox-service.yml
    - k8s/frontend-deployment.yml
    - k8s/frontend-service.yml
    - k8s/ingress.yml
    - k8s/frontend-ingress.yml
    - k8s/elb-redirect-ingress.yml
    - k8s/cert-issuer.yml
    - k8s/cert-wildcard.yml
    - k8s/duckdns-cronjob.yml
    - k8s/router-deployment.yml
    - k8s/router-service.yml
    - k8s/rbac.yml
    - k8s/secrets.yml
    - k8s/notification-deployment.yml
    - k8s/notification-service.yml