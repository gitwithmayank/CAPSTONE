server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite build output: hashed asset files can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- Google Search Console verification ----------
    # Google ka "HTML file" method hamesha "google<hex>.html" filename aur content
    # "google-site-verification: google<hex>.html" use karta hai, isliye ye rule
    # usse dynamically serve kar deta hai — public/ me file daalne ya image
    # rebuild karne ki zaroorat nahi.
    location ~ ^/(google[a-fA-F0-9]+\.html)$ {
        default_type text/html;
        return 200 "google-site-verification: $1";
    }

    # Koi bhi other missing .html file -> 404, NOT index.html.
    # Bina iske SPA fallback har path par index.html serve kar deta hai aur
    # verification/SEO crawlers ko "wrong content" milta hai (soft-404).
    location ~ \.html$ {
        try_files $uri =404;
    }

    # Single page app: any unknown path falls back to index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Probes (k8s/frontend-deployment.yml liveness + readiness isi ko hit karte hain)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
